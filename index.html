<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Algorithmus UI – Grid rechts</title>

<style>
  :root {
    --real-vh: 100vh;
  }
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: rgb(33,33,33);
    height: var(--real-vh);
    display: flex;
    justify-content: flex-end; /* alles nach rechts */
    align-items: flex-start;       /* vertikal zentriert */
    padding-top: 10px;
  }

  .right-grid {
    width: 55vw;                 /* breiter */
    max-width: 580px;            /* größere Maximalbreite */
    height: calc(var(--real-vh) - 20px);  /* bis fast an unteren Bildschirmrand */
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 1fr;
    gap: 10px;
    padding-right: 10px;
    padding-bottom: 15px;
  }

  /* Jedes einzelne Rechteck */
  .cell {
    background: rgb(50,50,50);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .hand-cell {
    position: relative;
  }

  .hand-content {
    position: absolute;
    top: 5%;
    left: 5%;
    right: 5%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    height: 100%;
  }
  .mapping-button {
    position: absolute;
    top: 5px;
    right: 5px;
    padding: 6px 12px;
    background-color: rgb(70,70,70);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    z-index: 50;
  }

  .hand-title {
    font-size: calc(3vw + 3vh);
    font-weight: 700;
    color: white;
    word-break: break-word;
  }

  .hand-icon {
    position: absolute;
    bottom: 10%;
    left: 50%;
    width: calc(15vw + 15vh);
    height: calc(15vw + 15vh);
    max-width: 90%;
    max-height: 50%;
    transform: translateX(-50%) rotate(180deg);
    stroke-width: 2.5;
    color: white;
    visibility: hidden;
  }

  .icon-right svg {
    transform: rotate(180deg) scaleX(-1);
  }

  .icon-left svg {
    transform: rotate(180deg);
  }

  .icon-random svg {
    transform: none;
  }

  .hand-icon.right-hand svg {
    transform: rotate(180deg) scaleX(-1);
  }

  .hand-icon.left-hand svg {
    transform: rotate(180deg);
  }

  .hand-icon.random-mode svg {
    transform: none;
  }

  .lage-cell {
    position: relative;
  }

  .lage-content {
    position: absolute;
    top: 5%;
    left: 5%;
    right: 5%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  .lage-letter {
    font-size: calc(15vw + 15vh);
    font-weight: 700;
    color: white;
    line-height: 1;
    width: 100%;
    word-break: break-word;
    text-align: center;
  }

  .lage-word {
    margin-top: 10px;
    font-weight: 600;
    color: white;
    font-size: calc(1.5vw + 1.5vh);
    max-width: 100%;
    text-transform: uppercase;
  }

  .gespielt-cell {
    position: relative;
  }
  .gespielt-cell.correct {
    background: rgb(80,140,85);
  }
  .gespielt-cell.incorrect {
    background: rgb(170,70,70);
  }

  .gespielt-content {
    position: absolute;
    top: 5%;
    left: 5%;
    right: 5%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .gespielt-letter {
    font-size: calc(15vw + 15vh);
    font-weight: 700;
    color: white;
    line-height: 1;
    width: 100%;
    text-align: center;
    word-break: break-word;
  }

  .rabbit-cell {
    position: relative;
  }

  .rabbit-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: calc(15vw + 15vh);
    height: calc(15vw + 15vh);
    max-width: 90%;
    max-height: 90%;
    transform: translate(-50%, -50%);
    stroke-width: 2.5;
    color: white;
  }


  /* Texte im Rechteck — rotiert wie im Original */
  .label {
    transform: rotate(-90deg);   /* exakt wie SVG */
    font-size: 26px;
    font-weight: bold;
    color: white;
    pointer-events: none;
    user-select: none;
  }

  #left-area {
    position: absolute;
    top: 0;
    left: 20px;
    width: calc(100vw - 55vw - 10px);
    height: var(--real-vh);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #stave-canvas {
    max-width: 90%;
    max-height: 90%;
  }

  .hand-cell { cursor: pointer; }
  .lage-cell { cursor: pointer; }
  /* Force VexFlow clefs to be white (all paths, glyphs, groups) */
  svg .vf-clef *,
  svg .vf-clef path,
  svg .vf-clef g,
  svg .vf-clef .vf-glyph {
    stroke: white !important;
    fill: white !important;
  }

  /* Make ALL VexFlow SVG elements white */
  svg.vf-document * {
    stroke: white !important;
    fill: white !important;
  }

  /* Thicker stave lines */
  svg .vf-stave path {
    stroke-width: 2.5px !important;
    stroke: rgb(120,120,120) !important;
  }

  /* Thicker note heads and stems */
  svg .vf-stavenote * {
    stroke-width: 2.5px !important;
  }

  svg.vf-document {
    transform: scale(var(--notation-zoom, 1));
    transform-origin: center center;
  }
</style>
  .lage-cell.mapping-active {
    outline: 4px solid rgb(200,200,50);
    outline-offset: -4px;
  }
</style>
</head>

<body>

  <div id="left-area">
    <div id="notation"></div>
    <div id="mapping-area" style="display:none; position:absolute; top:50%; left:45%; transform:translate(-50%, -50%); width:90%; text-align:left; color:white;">
      <div id="mapping-text" style="font-size:40px; font-weight:700;"></div>
      <div id="mapping-remaining" style="margin-top:20px; font-size:22px; color:rgb(180,180,180);"></div>
      <div id="mapping-hint" style="margin-top:20px; font-size:28px;"></div>
    </div>
  </div>

  <div class="right-grid">
    <div class="cell hand-cell">
      <div class="hand-content">
        <div class="hand-title">Rechte Hand</div>
        <i data-lucide="hand-helping" class="hand-icon icon-right" style="visibility: visible;"></i>
        <i data-lucide="hand-helping" class="hand-icon icon-left" style="visibility: hidden;"></i>
        <i data-lucide="dices" class="hand-icon icon-random" style="visibility: hidden;"></i>
        <i data-lucide="flask-conical" class="hand-icon icon-expert" style="visibility: hidden;"></i>
        <i data-lucide="map" class="hand-icon icon-mapping" style="visibility: hidden;"></i>
        <div id="range-notation" style="position:absolute; bottom:5%; left:50%; transform:translateX(-50%); width:90%; height:40%;">
        </div>
      </div>
    </div>
    <div class="cell lage-cell">
      <div class="lage-content">
        <div class="lage-letter">C</div>
        <div class="lage-word">Lage</div>
      </div>
    </div>
    <div class="cell gespielt-cell">
      <div class="gespielt-content">
        <div class="gespielt-letter">A</div>
    </div>
    </div>
    <div class="cell rabbit-cell">
      <i data-lucide="rabbit" class="rabbit-icon"></i>
    </div>
  </div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
<script>
  // --- MAPPING MODE ---
  let dailyCharacterLimit = 32200;   // 322 credits * 100 characters
  let dailyCharactersUsed = 0;

  let monthlyCharacterLimit = 32200 * 31;
  let monthlyCharactersUsed = 0;

  let lastLimitReset = null;
  let mappingMode = false;
  // --- MAPPING MODE MASTER LOCKS ---
  let mappingLocked = false;
  let mappingReady = false;
  let lastPlayedNote = null;
  const mappingArea = document.getElementById("mapping-area");
  const mappingText = document.getElementById("mapping-text");
  const mappingHint = document.getElementById("mapping-hint");
  const mappingRemaining = document.getElementById("mapping-remaining");

  function updateRemainingDisplay() {
    const dailyLeft = dailyCharacterLimit - dailyCharactersUsed;
    const monthlyLeft = monthlyCharacterLimit - monthlyCharactersUsed;
    mappingRemaining.textContent = `Heute verbleibend: ${dailyLeft} Zeichen — Dieser Monat: ${monthlyLeft} Zeichen`;
  }

  function startMappingMode() {
    document.getElementById("notation").style.visibility = "hidden";
    mappingArea.style.display = "block";
    document.querySelector(".lage-cell").classList.add("mapping-active");

    mappingText.textContent = "Augen schließen – konzentrieren.";
    mappingHint.textContent = "Bitte nimm nach jedem Ton die Hand vom Klavier, sodass du dich immer neu orientieren musst. Drücke nun eine beliebige Taste, wenn du bereit bist.";
    updateRemainingDisplay();

    mappingReady = true;
    mappingLocked = false;
    lastPlayedNote = null;
  }

  function stopMappingMode() {
    mappingArea.style.display = "none";
    document.querySelector(".lage-cell").classList.remove("mapping-active");
    document.getElementById("notation").style.visibility = "visible";
  }

let bestVoice = null;
const audioCache = {};

  function loadVoices() {
    const voices = speechSynthesis.getVoices();
    const german = voices.filter(v => v.lang && v.lang.startsWith("de"));

    if (german.length > 0) {
      bestVoice = german[0];
    } else {
      bestVoice = voices[0] || null;
    }
  }

  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  // --- Local audio playback for speak(text) ---
  async function speak(text) {
    const mapping = {
      "Spiele das": "spiele_das.mp3",
      "C": "ton_c.mp3",
      "D": "ton_d.mp3",
      "E": "ton_e.mp3",
      "F": "ton_f.mp3",
      "G": "ton_g.mp3",
      "A": "ton_a.mp3",
      "B": "ton_b.mp3",
      "mit der rechten Hand": "mit_der_rechten_hand.mp3",
      "mit der linken Hand": "mit_der_linken_hand.mp3",
      "aus der": "aus_der.mp3",
      "C-Lage": "c_lage.mp3",
      "D-Lage": "d_lage.mp3",
      "E-Lage": "e_lage.mp3",
      "F-Lage": "f_lage.mp3",
      "G-Lage": "g_lage.mp3",
      "A-Lage": "a_lage.mp3",
      "B-Lage": "b_lage.mp3",
      "Richtig": "richtig.mp3",
      "Falsch": "falsch.mp3",
      "Ziel war": "ziel_war.mp3",
      "Weiter nach links": "weiter_nach_links.mp3",
      "Weiter nach rechts": "weiter_nach_rechts.mp3"
    };

    // Local directory for audio files
    const base = "./"; // adjust if files are in a subfolder

    // If cached, play
    if (audioCache[text]) {
      try {
        const audio = audioCache[text];
        await new Promise(resolve => {
          audio.onended = resolve;
          audio.play();
        });
        return;
      } catch(e) {
        console.warn("Cached audio defekt, lade neu.", e);
      }
    }

    // Resolve filename
    const file = mapping[text];
    if (!file) {
      console.warn("Kein lokaler Audio-Baustein für:", text);
      return;
    }

    const audio = new Audio(base + file);
    audioCache[text] = audio;

    await new Promise(resolve => {
      audio.onended = resolve;
      audio.play();
    });
    return;
  }

let currentTarget = null;
const mappingNotes = [
  "C3","D3","E3","F3","G3","A3","B3",
  "C4","D4","E4","F4","G4","A4","B4",
  "C5","D5","E5","F5","G5","A5","B5"
];

  function nextMappingNote() {
      if (typeof nextMappingNote.lageCounter === "undefined") {
        nextMappingNote.lageCounter = 0;
      }
      const currentLage = lageList[nextMappingNote.lageCounter];
    const available = lageNotes[currentLage];
    const idx = Math.floor(Math.random() * available.length);
    currentTarget = available[idx].toUpperCase() + "4";

    // --- NEW: choose a hand randomly ---
    const handOptions = ["Rechten Hand", "Linken Hand"];
    const chosenHand = handOptions[Math.floor(Math.random() * handOptions.length)];

    const noteLetter = currentTarget.replace(/[0-9]/g, "");
    const handPhrase = (chosenHand === "Rechten Hand") ? "mit der rechten Hand" : "mit der linken Hand";
    const lagePhrase = currentLage + "-Lage";

    mappingText.textContent =
      `Spiele das ${noteLetter} ${handPhrase} aus der ${currentLage}-Lage`;
    nextMappingNote.lageCounter = (nextMappingNote.lageCounter + 1) % lageList.length;
    mappingHint.textContent = "";
    nextMappingNote.lageCounter = (nextMappingNote.lageCounter + 1) % lageList.length;

    setTimeout(async () => {
      await speak("Spiele das");
      await speak(noteLetter);
      await speak(handPhrase);
      await speak("aus der");
      await speak(lagePhrase);
    }, 2000);
  }

  function mappingHintFor(played, target) {
    const arr = mappingNotes;
    const p = arr.indexOf(played);
    const t = arr.indexOf(target);
    if (p < 0 || t < 0) return "";

    // Determine current chosen hand text from the last generated instruction
    const txt = mappingText.textContent.toLowerCase();
    const isLeft = txt.includes("linken hand");
    const isRight = txt.includes("rechten hand");

    // Base direction
    let dir = "";
    if (p < t) dir = "Weiter nach rechts";
    if (p > t) dir = "Weiter nach links";

    // Invert for left hand
    if (isLeft) {
      if (dir === "Weiter nach rechts") return "Weiter nach links";
      if (dir === "Weiter nach links") return "Weiter nach rechts";
    }

    return dir;
  }

  async function handleMappingPress(playedNote) {
    if (mappingLocked) return;
    mappingLocked = true;
    if (mappingReady) {
      mappingReady = false;
      mappingHint.textContent = "";
      mappingLocked = false;
      nextMappingNote();
      return;
    }
    if (!mappingMode) {
      mappingLocked = false;
      return;
    }
    if (playedNote === currentTarget) {
      speak("Richtig");
      setTimeout(() => {
        nextMappingNote();
        mappingLocked = false;
        lastPlayedNote = null;
      }, 2000);
    } else {
      await speak("Falsch");
      await speak("Ziel war");
      await speak(currentTarget.replace(/[0-9]/g, ""));
      const hint = mappingHintFor(playedNote, currentTarget);
      mappingHint.textContent = hint;
      setTimeout(async () => {
        await speak(hint);
        mappingLocked = false;
        lastPlayedNote = null;
      }, 2000);
    }
  }
  function fixVH() {
    document.documentElement.style.setProperty(
      "--real-vh",
      window.innerHeight + "px"
    );
  }
  fixVH();
  window.addEventListener("resize", fixVH);

  function applyZoom() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    let z = 1;

    // Stronger scaling for larger monitors
    if (w < 600) {
      z = 1.6;
    } else if (w < 900) {
      z = 1.45;
    } else if (w < 1400) {
      z = 1.3;
    } else if (w < 2000) {
      z = 1.55;
    } else {
      z = 1.75;
    }

    document.documentElement.style.setProperty("--notation-zoom", z);
  }
  applyZoom();
  window.addEventListener("resize", applyZoom);
</script>

<script>
  lucide.createIcons();

  let upperSeries = [];
  let lowerSeries = [];
  let upperCounter = 0;
  let lowerCounter = 0;
  let playUpper = true;

  let handModes = ["Rechte Hand", "Linke Hand", "Zufall", "Experte", "Bereich beüben", "Mapping"];
  let handIndex = 0;

let lageList = ["C", "D", "E", "F", "G", "A", "B"];
let lageIndex = 0;

  const handTitle = document.querySelector(".hand-title");
  let handIcon = document.querySelector(".hand-icon");
  const lageLetter = document.querySelector(".lage-letter");

  // --------- CLICK HAND ----------
  document.querySelector(".hand-cell").addEventListener("click", () => {
    handIndex = (handIndex + 1) % handModes.length;

    const mode = handModes[handIndex];

    // Update text
    handTitle.textContent = mode;

    let iconName = "hand-helping";

    // Hide all icons
    document.querySelector(".icon-right").style.visibility = "hidden";
    document.querySelector(".icon-left").style.visibility = "hidden";
    document.querySelector(".icon-random").style.visibility = "hidden";
    document.querySelector(".icon-expert").style.visibility = "hidden";
    document.querySelector(".icon-mapping").style.visibility = "hidden";

    // Show correct icon
    if (mode === "Rechte Hand") {
      document.querySelector(".icon-right").style.visibility = "visible";
    }
    else if (mode === "Linke Hand") {
      document.querySelector(".icon-left").style.visibility = "visible";
    }
    else if (mode === "Experte") {
      document.querySelector(".icon-expert").style.visibility = "visible";
    }
    else if (mode === "Bereich beüben") {
      // no icon displayed
    }
    else if (mode === "Mapping") {
      document.querySelector(".icon-mapping").style.visibility = "visible";
      mappingMode = true;
      startMappingMode();
      return;
    }
    else {
      document.querySelector(".icon-random").style.visibility = "visible";
      mappingMode = false;
      stopMappingMode();
    }

    generateSeries();
  });

  // --------- CLICK LAGE ----------
  document.querySelector(".lage-cell").addEventListener("click", () => {
    lageIndex = (lageIndex + 1) % lageList.length;
    lageLetter.textContent = lageList[lageIndex];
    generateSeries();
  });

  // --------- MIDI SETUP ----------
  let midiAccess = null;
  let lastNote = null;
  let mappingNoteIsDown = false;

  // SWIFT → JS bridge so Swift can call MIDI handler
  window.handleMIDIMessage = function(status, data1, data2) {
    const event = { data: [status, data1, data2] };
    onMIDIMessage(event);
  };

  function onMIDIMessage(event) {
    const [command, note, velocity] = event.data;

    if (mappingMode) {
      // MIDI command structure: 144 = note on, 128 = note off
      const isNoteOn = (command === 144 && velocity > 0);
      const isNoteOff = (command === 128 || (command === 144 && velocity === 0));

      // On note-off, re‑enable mapping detection
      if (isNoteOff) {
        mappingNoteIsDown = false;
        return;
      }

      // On note-on: process ONLY if previously released
      if (isNoteOn) {
        if (mappingNoteIsDown) return;
        mappingNoteIsDown = true;
      }

      const played = midiToNote(note) + "4";
      handleMappingPress(played);
      return;
    }

    if (command === 144 && velocity > 0) {
      const played = midiToNote(note);
      document.querySelector(".gespielt-letter").textContent = played;

      // Helper function for normalization
      function normalize(note) {
        return note.replace("♯", "#").toUpperCase();
      }

      // --- Speed Icon Logic ---
      const now = performance.now();
      if (!window._lastSpeedTime) window._lastSpeedTime = now;
      const delta = now - window._lastSpeedTime;
      window._lastSpeedTime = now;

      let speedIcon = "turtle";
      if (delta < 400) speedIcon = "rocket";
      else if (delta < 900) speedIcon = "rabbit";

      const speedElm = document.querySelector(".rabbit-icon");
      if (speedElm) {
        speedElm.setAttribute("data-lucide", speedIcon);
        lucide.createIcons();
      }

      const playedUpper = normalize(played);

      let upperExpected = upperSeries[upperCounter];
      let lowerExpected = lowerSeries[lowerCounter];

      let upperMatch = false;
      let lowerMatch = false;

      if (upperExpected) {
        const expU = normalize(upperExpected.note);
        if (playedUpper === expU) upperMatch = true;
      }

      if (lowerExpected) {
        const expL = normalize(lowerExpected.note);
        if (playedUpper === expL) lowerMatch = true;
      }

      if (handModes[handIndex] === "Rechte Hand") {
        if (upperMatch) {
          upperExpected.color = "rgb(80,140,85)";
          upperCounter++;
        } else {
          upperExpected.color = "rgb(170,70,70)";
        }
      }

      else if (handModes[handIndex] === "Linke Hand") {
        if (lowerMatch) {
          lowerExpected.color = "rgb(80,140,85)";
          lowerCounter++;
        } else {
          lowerExpected.color = "rgb(170,70,70)";
        }
      }

      else if (handModes[handIndex] === "Zufall") {
        if (playUpper) {
          if (upperMatch) {
            upperExpected.color = "rgb(80,140,85)";
            upperCounter++;
          } else {
            upperExpected.color = "rgb(170,70,70)";
          }
        } else {
          if (lowerMatch) {
            lowerExpected.color = "rgb(80,140,85)";
            lowerCounter++;
          } else {
            lowerExpected.color = "rgb(170,70,70)";
          }
        }
        playUpper = !playUpper;
      }

      else if (handModes[handIndex] === "Experte") {
        if (upperMatch) {
          upperExpected.color = "rgb(80,140,85)";
          upperCounter++;
        }
        if (lowerMatch) {
          lowerExpected.color = "rgb(80,140,85)";
          lowerCounter++;
        }
        if (!upperMatch && !lowerMatch) {
          if (upperExpected) upperExpected.color = "rgb(170,70,70)";
          if (lowerExpected) lowerExpected.color = "rgb(170,70,70)";
        }
      }

      // Set .gespielt-letter color according to correctness
      const gespieltElm = document.querySelector(".gespielt-letter");
      const gespieltCell = document.querySelector(".gespielt-cell");

      if (upperMatch || lowerMatch) {
        gespieltElm.style.color = "white";
        gespieltCell.classList.remove("incorrect");
        gespieltCell.classList.add("correct");
      } else {
        gespieltElm.style.color = "white";
        gespieltCell.classList.remove("correct");
        gespieltCell.classList.add("incorrect");
      }

      drawSeries();

      let upperDone = (upperCounter >= upperSeries.length);
      let lowerDone = (lowerCounter >= lowerSeries.length);

      if (handModes[handIndex] === "Rechte Hand" && upperDone) {
        setTimeout(() => generateSeries(), 400);
      }
      else if (handModes[handIndex] === "Linke Hand" && lowerDone) {
        setTimeout(() => generateSeries(), 400);
      }
      else if ((handModes[handIndex] === "Zufall") && upperDone && lowerDone) {
        setTimeout(() => generateSeries(), 400);
      }
      else if ((handModes[handIndex] === "Experte") && upperDone && lowerDone) {
        setTimeout(() => generateSeries(), 400);
      }
    }
  }

  function midiToNote(num) {
    const notes = ["C", "C#", "D", "D#", "E","F","F#","G","G#","A","A#","B"];
    return notes[num % 12];
  }

  if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then((access) => {
      midiAccess = access;
      for (let input of midiAccess.inputs.values()) {
        input.onmidimessage = onMIDIMessage;
      }
    });
  }

  const lageNotes = {
    "C": ["c", "d", "e", "f", "g"],
    "D": ["d", "e", "f#", "g", "a"],
    "E": ["e", "f#", "g#", "a", "b"],
    "F": ["f", "g", "a", "b", "c"],
    "G": ["g", "a", "b", "c", "d"],
    "A": ["a", "b", "c", "d", "e"],
    "B": ["b", "c#", "d", "e", "f#"]
  };

// Global range note keys for range selector
let rangeNoteKeys = ["c/4", "d/4"];

  function generateSeries() {
    if (handModes[handIndex] === "Bereich beüben") {
      document.getElementById("range-notation").style.display = "block";
      upperSeries = [
        { note: "c", octave: 4, clef: "treble", color: "white" },
        { note: "d", octave: 4, clef: "treble", color: "white" }
      ];
      lowerSeries = [];
      upperCounter = 0;
      lowerCounter = 0;
      playUpper = true;
      drawRangeSelector();
      drawSeries();
      return;
    } else {
      document.getElementById("range-notation").style.display = "none";
    }
    lowerSeries = [];
    upperSeries = [];
    upperCounter = 0;
    lowerCounter = 0;
    playUpper = true;
    seriesLength = 5;

    const lage = lageList[lageIndex];
    const possibleNotes = lageNotes[lage];

    for (let i = 0; i < seriesLength; i++) {
      let r = Math.floor(Math.random() * possibleNotes.length);

      let clef = "treble";
      let octave = 4;

      if (handModes[handIndex] === "Linke Hand") {
        clef = "bass";
        octave = 2;
      }

      if (handModes[handIndex] === "Zufall") {
        clef = Math.random() < 0.5 ? "treble" : "bass";
        octave = clef === "treble" ? 4 : 2;
      }

      upperSeries.push({
        note: possibleNotes[r],
        octave: octave,
        clef: clef,
        color: "white"
      });
    }

    if (handModes[handIndex] === "Zufall" || handModes[handIndex] === "Experte") {
      lowerSeries = [];
      for (let i = 0; i < seriesLength; i++) {
        let r = Math.floor(Math.random() * possibleNotes.length);
        lowerSeries.push({
          note: possibleNotes[r],
          octave: 2,
          clef: "bass",
          color: "white"
        });
      }
    }

    drawSeries();
  }

  function drawRangeSelector() {
    const div = document.getElementById("range-notation");
    div.innerHTML = "";
    const renderer = new Vex.Flow.Renderer(div, Vex.Flow.Renderer.Backends.SVG);
    renderer.resize(div.clientWidth, div.clientHeight);
    const context = renderer.getContext();
    const stave = new Vex.Flow.Stave(10, 10, div.clientWidth - 20);
    stave.addClef("treble").setContext(context).draw();

    function createDraggableNote(key) {
      return new Vex.Flow.StaveNote({
        clef: "treble",
        keys: [key],
        duration: "q"
      });
    }

    let notes = [
      createDraggableNote(rangeNoteKeys[0]),
      createDraggableNote(rangeNoteKeys[1])
    ];

    // Add drag handlers on the SVG elements after rendering
    setTimeout(() => {
      const svg = div.querySelector("svg");
      const noteheads = svg.querySelectorAll(".vf-notehead");

      noteheads.forEach((head, index) => {
        head.style.cursor = "grab";

        let dragging = false;
        let lastY = 0;

        function startDrag(ev) {
          dragging = true;
          lastY = ev.touches ? ev.touches[0].clientY : ev.clientY;
          head.style.cursor = "grabbing";
        }

        function moveDrag(ev) {
          if (!dragging) return;
          let y = ev.touches ? ev.touches[0].clientY : ev.clientY;
          let deltaY = y - lastY;
          if (Math.abs(deltaY) < 4) return;
          lastY = y;

          let currentKey = rangeNoteKeys[index];
          let [base, oct] = currentKey.split("/");
          oct = parseInt(oct);

          // chromatic note list
          const steps = ["c","c#","d","d#","e","f","f#","g","g#","a","a#","b"];

          // find current index
          let stepIndex = steps.indexOf(base.toLowerCase());
          if (stepIndex === -1) return;

          // move one staff step
          if (deltaY < 0) {
            stepIndex++;
            if (stepIndex >= steps.length) {
              stepIndex = 0;
              oct++;
            }
          } else {
            stepIndex--;
            if (stepIndex < 0) {
              stepIndex = steps.length - 1;
              oct--;
            }
          }

          let newBase = steps[stepIndex];
          rangeNoteKeys[index] = newBase + "/" + oct;

          drawRangeSelector();
        }

        function endDrag() {
          if (dragging) {
            dragging = false;
            head.style.cursor = "grab";
            generateSeries();
          }
        }

        head.addEventListener("mousedown", startDrag);
        head.addEventListener("touchstart", startDrag, { passive: true });

        window.addEventListener("mousemove", moveDrag);
        window.addEventListener("touchmove", moveDrag, { passive: true });

        window.addEventListener("mouseup", endDrag);
        window.addEventListener("touchend", endDrag);
      });
    }, 50);

    const voice = new Vex.Flow.Voice({ num_beats: 2, beat_value:4 });
    notes.forEach(n=>voice.addTickable(n));
    new Vex.Flow.Formatter().joinVoices([voice]).format([voice], stave.getWidth()-20);
    voice.draw(context, stave);
  }

  // --------- VEXFLOW RENDER ----------
  function drawSeries() {
    var notationDiv = document.getElementById("notation");
    notationDiv.innerHTML = "";

    var totalWidth = 530;
    var totalHeight = 300;

    var renderer = new Vex.Flow.Renderer(notationDiv, Vex.Flow.Renderer.Backends.SVG);
    renderer.resize(totalWidth, totalHeight);
    var context = renderer.getContext();

    function renderStave(yOffset, series) {
      var stave = new Vex.Flow.Stave(10, yOffset, totalWidth - 20);
      if (series.length > 0) {
        stave.addClef(series[0].clef);
      }
      stave.setContext(context).draw();

      var staveNotes = series.map(function(item) {
        const key = item.note + "/" + item.octave;
        const note = new Vex.Flow.StaveNote({
          clef: item.clef,
          keys: [key],
          duration: "q"
        }).setStyle({ fillStyle: item.color, strokeStyle: item.color });

        // Set ledger line color to match stave line color
        const ledgerColor = "rgb(120,120,120)";
        if (typeof note.setLedgerLineStyle === "function") {
          note.setLedgerLineStyle({ strokeStyle: ledgerColor });
        } else if (note.render_options) {
          note.render_options.ledgerLineColor = ledgerColor;
        }

        if (item.note.includes("#")) {
          note.addModifier(new Vex.Flow.Accidental("#"), 0);
        }
        return note;
      });

      var voice = new Vex.Flow.Voice({ num_beats: seriesLength, beat_value: 4 });
      staveNotes.forEach(n => voice.addTickable(n));
      new Vex.Flow.Formatter().joinVoices([voice]).format([voice], stave.getWidth() - 20);
      voice.draw(context, stave);
    }

    renderStave(40, upperSeries);

    if (handModes[handIndex] === "Zufall" || handModes[handIndex] === "Experte") {
      renderStave(180, lowerSeries);
    }
  }

  generateSeries();
</script>
